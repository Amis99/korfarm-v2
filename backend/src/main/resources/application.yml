spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/korfarm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:korfarm}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    issuer: ${JWT_ISSUER:korfarm}
    secret: ${JWT_SECRET}
    access-token-seconds: ${JWT_ACCESS_SECONDS:3600}
    refresh-token-seconds: ${JWT_REFRESH_SECONDS:1209600}
  toss:
    client-key: ${TOSS_CLIENT_KEY:test_ck_placeholder}
    secret-key: ${TOSS_SECRET_KEY:test_sk_placeholder}
  print:
    enabled: false
    command: ${PRINT_COMMAND:}
    working-dir: ${PRINT_WORKDIR:}
    timeout-seconds: ${PRINT_TIMEOUT_SECONDS:30}

claude:
  api:
    key: ${CLAUDE_API_KEY:}
    url: https://api.anthropic.com/v1/messages
