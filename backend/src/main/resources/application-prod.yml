spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 0

logging:
  level:
    root: WARN
    com.korfarm: INFO
  file:
    name: /opt/korfarm/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
